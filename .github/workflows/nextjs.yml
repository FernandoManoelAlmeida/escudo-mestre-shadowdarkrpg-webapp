# Build and deploy Next.js (static export) to GitHub Pages.
env:
  APP_DIR: .

name: Deploy Next.js site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # String "1" (build local); o Actions também injeta `true` noutros passos — ver lib/githubPagesEnv.ts
      GITHUB_PAGES: "1"
      NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager (run from app directory)"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: ${{ env.APP_DIR }}/${{ steps.detect-package-manager.outputs.manager == 'yarn' && 'yarn.lock' || 'package-lock.json' }}

      # Sem `static_site_generator: next` — o action reescreve next.config e o withPWA deixa de gerar sw.js.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_DIR }}/.next/cache
          key: ${{ runner.os }}-nextjs-pwa-export-v2-${{ hashFiles(format('{0}/package-lock.json', env.APP_DIR), format('{0}/yarn.lock', env.APP_DIR)) }}-${{ hashFiles(format('{0}/**.[jt]s', env.APP_DIR), format('{0}/**.[jt]sx', env.APP_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-nextjs-pwa-export-v2-${{ hashFiles(format('{0}/package-lock.json', env.APP_DIR), format('{0}/yarn.lock', env.APP_DIR)) }}-

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Build with Next.js
        env:
          NODE_ENV: production
          GITHUB_PAGES: "1"
          GITHUB_ACTIONS: "true"
          NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
        run: |
          rm -rf .next
          node scripts/clean-pwa-export-artifacts.js
          ${{ steps.detect-package-manager.outputs.manager }} run build

      - name: Verify PWA (GitHub Pages subpath)
        env:
          NODE_ENV: production
          GITHUB_PAGES: "1"
          GITHUB_ACTIONS: "true"
          NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
        run: ${{ steps.detect-package-manager.outputs.manager }} run verify:pwa-github-pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
